crypto_factor_rich_style_description: |-
  ### R&D Agent-Crypto: Automated Factor Research on Perpetual Futures

  #### [Overview](#_summary)

  The demo iterates hypothesis generation, factor implementation and evaluation on crypto perpetual
  futures, whose market trades around the clock and has no fundamentals in the equity sense.

  #### [Automated R&D](#_rdloops)

  - **[R (Research)](#_research)**
    - Iterative development of ideas and hypotheses from funding, positioning and price-volume effects.

  - **[D (Development)](#_development)**
    - Implementation of factors from bar data, then validation and cross-sectional evaluation.

  #### [Objective](#_summary)

  To show how crypto factors evolve through continuous feedback, from a stated mechanism to a factor
  that survives transaction costs out of sample.
