crypto_quant_background: |-
  You are one of the most authoritative quantitative researchers at a top crypto hedge fund. I need your
  expertise to develop new factors that can enhance our investment returns. Based on the given context, I
  will ask for your assistance in designing and implementing a factor.

  Crypto assets traded on centralized exchanges, as linear perpetual futures margined in a stablecoin.
  - Markets trade 24/7 with no closing auction; there are no fundamentals in the equity sense and no
    earnings calendar. Supply schedules and token unlocks exist but are not in the data.
  - Participation is retail-heavy and leveraged. Liquidations cascade, so price moves can overshoot and
    then partially revert; crowded positioning is visible in funding and open interest.
  - Perpetual futures have no expiry. A funding payment between longs and shorts keeps the perpetual
    near spot: positive funding means longs pay shorts, i.e. demand for leveraged long exposure.
  - The cross-section is dominated by one common market factor. Small caps have higher volatility,
    wider spreads and stronger retail attention effects than majors.
  - Shorting spot is hard; shorting via perpetuals is easy but costs funding when funding is negative.


  The factor is a characteristic or variable used in quant investment that can help explain the returns and risks of a portfolio or a single asset. Factors are used by investors to identify and exploit sources of excess returns, and they are central to many quantitative investment strategies.
  Each number in the factor represents a physics value to an instrument on a day.
  User will train a model to predict the next several days return based on the factor values of the previous days.
  The factor is defined in the following parts:
  1. Name: The name of the factor.
  2. Description: The description of the factor.
  3. Formulation: The formulation of the factor.
  4. Variables: The variables or functions used in the formulation of the factor.
  The factor might not provide all the parts of the information above since some might not be applicable.
  Please specifically give all the hyperparameter in the factors like the window size, look back period, and so on. One factor should statically defines one output with a static source data. For example, last 10 days momentum and last 20 days momentum should be two different factors.

  {% if runtime_environment %}
  ====== Runtime Environment ======
  You have following environment to run the code:
  {{ runtime_environment }}
  {% endif %}

crypto_quant_calendar: |-
  The clock:
  - session: Trades 24 hours a day, 7 days a week, with no holidays; every time is UTC.
  - funding: Perpetual funding settles at 00:00, 08:00 and 16:00 UTC on most contracts (every 4 or 1 hours on some).
  - expiries: Crypto options and dated futures expire on the last Friday of the month at 08:00 UTC; the quarterly expiries (March, June, September, December) are the largest.
  - weekends: The CME and traditional desks are closed on Saturday and Sunday; the US equity session is 09:30 to 16:00 New York time on weekdays.

crypto_factor_data: |-
  Fields are referenced as `$name`, and each names a column of the data below: the column of the same
  name without `$` holds it, except `$amount`, which is the `quote_volume` column. Only the columns of
  the schemas below are offered; the spot price of a perpetual's own pair and the index price are not
  in the data.

  {{ data_schemas }}

crypto_factor_interface: |-
  Your python code should follow the interface to better interact with the user's system.
  Your python code should contain the following parts: the import part, the function part, and the main
  part. Write a main function named "calculate_{function_name}" and call this function in the
  "if __name__ == '__main__'" part. Don't write any try-except block in your python code. The user will
  catch the exception message and provide the feedback to you.
  The user will write your python code into a python file and execute the file directly with
  "python {your_file_name}.py". Your code should read the data the schemas describe, calculate the
  factor values and save the result into a HDF5(H5) file named "result.h5" in
  the same directory as your python file. The result file is a pandas dataframe whose index is the
  "datetime" and "instrument" MultiIndex of the bars and whose single column name is the factor name,
  holding the factor value. The result file should be saved in the same directory as your python file.
  The code runs on CPU with pandas and numpy. Don't open network connections and don't read files other
  than the bars. Don't leak the future: the value of a bar may use that bar and the earlier bars only.

crypto_factor_strategy: |-
  Ensure that for every step of data processing, the data format (including indexes) is clearly explained through comments.
  Each transformation or calculation should be accompanied by a detailed description of how the data is structured, especially focusing on key aspects like whether the data has multi-level indexing, how to access specific columns or index levels, and any operations that affect the data shape (e.g., `reset_index()`, `groupby()`, `merge()`).
  This step-by-step explanation will ensure clarity and accuracy in data handling. For example:

  ```python
  # The initial DataFrame has a multi-level index with 'datetime' and 'instrument'.
  # To access the 'datetime' index, use df.index.get_level_values('datetime').
  datetime_values = df.index.get_level_values('datetime')
  ```

  ```python
  # Reset the index to move 'datetime' and 'instrument' from the index to columns.
  # This operation flattens the multi-index structure.
  df = df.reset_index()
  ```

  ```python
  # Group by 'instrument' to compute a time series per perpetual.
  # After the groupby, each group is indexed by 'datetime'.
  df_grouped = df.groupby('instrument').apply(lambda x: x.sort_index())
  ```

  ```python
  # The factor uses the current bar and the earlier bars only.
  # shift(1) moves the previous bar's value onto the current bar, so no future value is read.
  df['past_value'] = df.groupby('instrument')['close'].shift(1)
  ```

  ```python
  # When merging DataFrames, merge on both 'datetime' and 'instrument'.
  # If these are part of the index, reset the index before merging.
  merged_df = pd.merge(df, other_df, on=['datetime', 'instrument'], how='inner')
  ```

crypto_factor_output_format: |-
  Your output should be a pandas dataframe similar to the following example information:
  <class 'pandas.core.frame.DataFrame'>
  MultiIndex: 438000 entries, (Timestamp('2023-01-01 00:00:00'), 'AAA') to (Timestamp('2024-12-31 23:00:00'), 'EEE')
  Data columns (total 1 columns):
  #   Column            Non-Null Count  Dtype
  ---  ------            --------------  -----
  0   your factor name  438000 non-null  float64
  dtypes: float64(1)
  memory usage: <ignore>
  Notice: The non-null count is OK to be different to the total number of entries since a factor may have no value in the warm-up bars or for an instrument that lacks the needed history.
  One possible format of `result.h5` may be like following:
  datetime    instrument
  2024-01-02  AAA     -0.001796
              BBB      0.005780
              CCC      0.004228
              DDD      0.001298
              EEE      0.005330
                                 ...
  2024-12-31  BBB      0.000000
              DDD      0.002459

crypto_factor_simulator: |-
  The factors will be sent into the user's simulator to be evaluated on crypto perpetual futures.
  The factor values are ranked cross-sectionally at every bar, so a factor only has to order the instruments, not to predict the return level.
  User will automatically do the following things:
  1. align every factor to the (datetime, instrument) index of the bars.
  2. compute the forward return of each perpetual over the holding horizon, from the bar's close.
  3. measure the IC and rank IC of the factor against the forward return at every bar, then average them.
  4. build a long-short portfolio from the top and bottom quantiles of the factor at every bar, and evaluate its return, Sharpe ratio, max drawdown and turnover net of trading fees and funding.
  5. split the sample into an in-sample window, a validation window and a held-out window; only the in-sample and validation results are visible to you.

