crypto_qlib_setting: |-
  How the factors and models are evaluated, on qlib:
  - Universe: the `{{ market }}` pool. On the first day of each month it is the USD-M perpetuals quoted in
    USDT with the highest mean daily quote volume over the 30 days before that day (an instrument needs
    bars on at least 20 of them); delisted instruments are included while they traded, so there is no
    survivorship bias. Nothing of the month itself chooses the pool.
  - Frequency: one row per instrument per UTC day; the value of a day is known at its end (00:00 UTC of
    the next day). Every day is a trading day, weekends included.
  - Label: `Ref($close, -2) / Ref($close, -1) - 1`, the return from the close of the next day to the close
    of the day after, normalised across the instruments of each day. A factor of day t predicts it.
  - Model: by default a LightGBM regressor on a set of base price-volume features plus the factors.
  - Backtest: each day, hold the {{ topk }} instruments with the highest prediction, long only and equally
    weighted, replacing at most {{ n_drop }} a day, trading at the close with a cost of {{ open_cost }} on
    each buy and {{ close_cost }} on each sale; compared with {{ benchmark }}. Returns are price returns:
    funding payments are not in them.
  - Metrics: IC and Rank IC of the predictions against the label (mean and IR across days), and the
    annualised return, information ratio and maximum drawdown of the backtest, annualised over 365 days.
  - Segments: train {{ train_start }} to {{ train_end }}, valid {{ valid_start }} to {{ valid_end }},
    test {{ test_start }} to {{ test_end or "the last day of the data" }}.
  Because the cross-section moves with one common market factor, what predicts the label is the part of
  the return that differs between instruments on the same day: a factor helps when it ranks the
  instruments, not when it times the market.

