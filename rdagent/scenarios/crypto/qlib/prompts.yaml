crypto_qlib_model_background: |-
  You are one of the most authoritative quantitative researchers at a top crypto hedge fund. I need your
  expertise to develop new models that can enhance our investment returns.

  {{ market }}

  The model is a machine learning or deep learning structure used in quantitative investment to predict the returns and risks of a portfolio or a single asset. Models are employed by investors to generate forecasts based on historical data and identified factors, which are central to many quantitative investment strategies.
  Each model takes the factors as input and predicts the future returns.
  The model is defined in the following parts:
  1. Name: The name of the model.
  2. Description: The description of the model.
  3. Architecture: The detailed architecture of the model, such as neural network layers or tree structures.
  4. Hyperparameters: The hyperparameters used in the model.
  5. Training_hyperparameters: The hyperparameters used during the training process.
  6. ModelType: The type of the model, "Tabular" for tabular model and "TimeSeries" for time series model.
  The model should provide clear and detailed documentation of its architecture and hyperparameters. One model should statically define one output with a fixed architecture and hyperparameters.
  The daily cross-section holds about a hundred instruments over a few years, far fewer samples than an
  equity market: prefer models that resist overfitting to models with many parameters.

  {% if runtime_environment is not none %}
  ====== Runtime Environment ======
  You have following environment to run the code:
  {{ runtime_environment }}
  {% endif %}

crypto_qlib_quant_background: |-
  Quantitative investment is a data-driven approach to asset management that relies on mathematical models, statistical techniques, and computational methods to analyze financial markets and make investment decisions. Two essential components of this approach are factors and models.

  You are one of the most authoritative quantitative researchers at a top crypto hedge fund. I need your expertise to develop new factors and models that can enhance our investment returns. Based on the given context, I will ask for your assistance in designing and implementing either factors or a model.

  {{ market }}

  {% if runtime_environment is not none %}
  ====== Runtime Environment ======
  You have following environment to run the code:
  {{ runtime_environment }}
  {% endif %}

crypto_qlib_factor_output_format: |-
  Your output should be a pandas dataframe similar to the following example information:
  <class 'pandas.core.frame.DataFrame'>
  MultiIndex: 72900 entries, (Timestamp('2023-01-01 00:00:00'), 'BTCUSDT') to (Timestamp('2024-12-31 00:00:00'), 'XRPUSDT')
  Data columns (total 1 columns):
  #   Column            Non-Null Count  Dtype
  ---  ------            --------------  -----
  0   your factor name  72900 non-null  float64
  dtypes: float64(1)
  memory usage: <ignore>
  Notice: The non-null count is OK to be different to the total number of entries since some instruments may not have the factor value on some days (before enough history, or after a delisting).
  One possible format of `result.h5` may be like following:
  datetime    instrument
  2024-01-06  BTCUSDT      -0.001796
              DOGEUSDT      0.005780
              ETHUSDT       0.004228
              SOLUSDT       0.001298
              XRPUSDT       0.005330
                              ...
  2024-12-31  ETHUSDT       0.000000
              SOLUSDT       0.002459
  Every UTC day is a row, Saturdays and Sundays included; an instrument is named by its Binance symbol.

crypto_qlib_factor_simulator: |-
  The factors will be sent into Qlib to train a model that predicts the next days' returns of crypto perpetuals from the factor values of the previous days.
  User will use Qlib to automatically do the following things:
  1. generate a new factor table based on the factor values.
  2. train a model like LightGBM to predict the label from the factors.
  3. build a portfolio from the predictions with the strategy below.
  4. evaluate the predictions and the portfolio.

  {{ setting }}

crypto_qlib_model_simulator: |-
  The models will be sent into Qlib to train and evaluate their performance in predicting the next days' returns of crypto perpetuals. Hypothesis is improved upon checking the feedback on the results.
  User will use Qlib to automatically perform the following tasks:
  1. Generate a baseline factor table.
  2. Train the model defined in your class Net to predict the label from the factors.
  3. Build a portfolio from the predictions with the strategy below.
  4. Evaluate the predictions and the portfolio, and iterate on the hypothesis.

  {{ setting }}

crypto_qlib_experiment_setting: |-
